<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Loading...</title>

		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#12131a" />
		<link rel="stylesheet" href="common/css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="common/css/main.css" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
	</head>

	<body id="homepage">
		<div id="bg" aria-hidden="true"></div>

		<!-- Password overlay -->
		<div id="auth-overlay" class="auth-overlay hidden">
			<form id="auth-form" class="auth-card" autocomplete="off">
				<i class="fa-solid fa-lock auth-icon" aria-hidden="true"></i>
				<h2 class="auth-title">Enter Password</h2>
				<p class="auth-subtitle">This dashboard is password protected.</p>
				<div class="auth-field">
					<input type="password" id="auth-password" name="password" placeholder="Password" required autofocus />
				</div>
				<button type="submit" class="auth-button">Unlock</button>
				<p id="auth-error" class="auth-error hidden"></p>
			</form>
		</div>

		<main id="wrapper">
			<header id="dash-header">
				<h1 id="dash-title"></h1>
			</header>

			<nav id="itemlist" aria-label="Shortcuts">
				<a class="tile" title="Loading...">
					<span class="tile-icon"><i class="fa-solid fa-spinner fa-spin fa-fw" aria-hidden="true"></i></span>
					<span class="tile-label">Loading…</span>
				</a>
			</nav>
		</main>

		<script src="common/js/trianglify.min.js"></script>
		<script>
			const bg = document.getElementById("bg");
			const authOverlay = document.getElementById("auth-overlay");
			const authForm = document.getElementById("auth-form");
			const authPassword = document.getElementById("auth-password");
			const authError = document.getElementById("auth-error");

			let config = null;
			let passwordHash = null;

			// SHA-256 hash a string using Web Crypto API
			async function sha256(text) {
				const encoder = new TextEncoder();
				const data = encoder.encode(text);
				const hashBuffer = await crypto.subtle.digest("SHA-256", data);
				const hashArray = Array.from(new Uint8Array(hashBuffer));
				return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
			}

			function showAuthOverlay() {
				authOverlay.classList.remove("hidden");
				authPassword.focus();
			}

			function hideAuthOverlay() {
				authOverlay.classList.add("hidden");
			}

			async function checkPassword(password) {
				if (!passwordHash) return true;
				const inputHash = await sha256(password);
				return inputHash === passwordHash;
			}

			authForm.addEventListener("submit", async (e) => {
				e.preventDefault();
				authError.classList.add("hidden");

				const password = authPassword.value;
				if (!password) return;

				try {
					const valid = await checkPassword(password);
					if (valid) {
						sessionStorage.setItem("simple-dash-auth", "true");
						hideAuthOverlay();
					} else {
						authError.textContent = "Incorrect password. Please try again.";
						authError.classList.remove("hidden");
						authPassword.value = "";
						authPassword.focus();
					}
				} catch (err) {
					console.error(err);
					authError.textContent = "An error occurred while checking the password.";
					authError.classList.remove("hidden");
				}
			});

			async function loadConfig() {
				const itemlist = document.getElementById("itemlist");
				const heading = document.getElementById("dash-title");

				try {
					const response = await fetch("config.json", { cache: "no-store" });

					if (!response.ok) {
						throw new Error(`Error: ${response.status}`);
					}

					config = await response.json();
					document.title = config.title ?? "simple-dash";
					heading.textContent = config.title ?? "";
					itemlist.classList.toggle("no-labels", config.showLabels === false);
					if (typeof config.glassOpacity === "number" && config.glassOpacity >= 0 && config.glassOpacity <= 1) {
						document.documentElement.style.setProperty("--glass-opacity", String(config.glassOpacity));
					}
					applyBackground(config.background);

					// Check for password protection
					if (config.password) {
						passwordHash = config.password;
						const isAuthenticated = sessionStorage.getItem("simple-dash-auth") === "true";
						if (!isAuthenticated) {
							showAuthOverlay();
							return; // Don't render items until authenticated
						}
					}

					renderItems(config);
				} catch (error) {
					console.error(error);
					document.title = error.message;
					heading.textContent = "";

					itemlist.classList.add("is-message");
					itemlist.replaceChildren();
					const panel = document.createElement("div");
					panel.className = "message-panel";
					panel.innerHTML =
						'<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
						'<span>Couldn\u2019t load config.json \u2014 check the console for details.</span>';
					itemlist.appendChild(panel);
				}
			}

			function renderItems(config) {
				const itemlist = document.getElementById("itemlist");
				const fragment = document.createDocumentFragment();

				(config.items ?? []).forEach((item, index) => {
					const tile = document.createElement("a");
					tile.className = "tile";
					tile.href = item.link;
					tile.target = item.target === "_blank" ? "_blank" : "_self";
					if (tile.target === "_blank") tile.rel = "noopener noreferrer";
					tile.title = item.alt;
					tile.style.setProperty("--i", index);

					const iconWrap = document.createElement("span");
					iconWrap.className = "tile-icon";
					const icon = document.createElement("i");
					icon.className = `${item.icon} fa-fw`;
					icon.setAttribute("aria-hidden", "true");
					iconWrap.appendChild(icon);

					const label = document.createElement("span");
					label.className = "tile-label";
					label.textContent = item.alt ?? "";

					tile.append(iconWrap, label);
					fragment.appendChild(tile);
				});

				itemlist.classList.remove("is-message");
				itemlist.replaceChildren(fragment);
			}

			// The background is a fixed, viewport-pinned layer (see #bg in the
			// CSS) rather than a background-image on body: it only ever needs
			// to match the viewport size, never the page's scrollable content
			// height, and it visually stays put while the tiles scroll over it.
			function renderBackground() {
				const pattern = Trianglify({ width: window.innerWidth, height: window.innerHeight });
				bg.style.backgroundImage = `url(${pattern.png()})`;
			}

			let usingCustomBackground = false;

			// config.background (optional) points at a custom image - any URL
			// or path relative to config.json. Preloaded so a broken path
			// falls back to the generated pattern instead of a blank layer.
			function applyBackground(path) {
				if (!path) {
					usingCustomBackground = false;
					bg.classList.remove("custom");
					return;
				}

				const preload = new Image();
				preload.onload = () => {
					usingCustomBackground = true;
					bg.classList.add("custom");
					bg.style.backgroundImage = `url(${JSON.stringify(path)})`;
				};
				preload.onerror = () => {
					console.warn(`Couldn't load the custom background "${path}"; using the generated pattern instead.`);
					usingCustomBackground = false;
					bg.classList.remove("custom");
					renderBackground();
				};
				preload.src = path;
			}

			let resizeTimer;
			window.addEventListener("resize", () => {
				clearTimeout(resizeTimer);
				resizeTimer = setTimeout(() => {
					if (usingCustomBackground) return;
					renderBackground();
				}, 400);
			});

			loadConfig();
			renderBackground();
		</script>
	</body>
</html>
